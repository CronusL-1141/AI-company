name: Bug report
description: AI Team OS did something different from what its documentation or tool descriptions say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A useful report says what you expected, what happened instead, and how to make it happen again.

        - **Security problem?** Please do not file it here. Use [private vulnerability reporting](https://github.com/CronusL-1141/AI-company/security/advisories/new).
        - **An idea or a question rather than a bug?** Post it in [Ideas](https://github.com/CronusL-1141/AI-company/discussions/categories/ideas) or [Q&A](https://github.com/CronusL-1141/AI-company/discussions/categories/q-a).
        - **In a Claude Code or Codex session** you can ask the assistant to file this for you (`/os-feedback` in Claude Code). It removes personal paths and names, and shows you the exact text before anything is sent. Reports filed that way have the same sections as this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Paste exact error text or hook output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Team OS version
      description: "`/plugin` in Claude Code shows it. For a source install, see `version` in pyproject.toml."
      placeholder: "1.16.0"
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: Install method
      description: "One of: Claude Code plugin (marketplace), Claude Code source install (install.py), Codex adapter, Not sure"
      placeholder: "Claude Code plugin (marketplace)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The host and its version, the operating system, the CPU architecture.
      placeholder: "Claude Code 2.1.3, macOS 15.1, arm64"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: /os-doctor output
      description: Optional, but it speeds things up a lot. Run `/os-doctor` in a session inside the affected project and paste the result. Check it for anything private first.
      render: text
  - type: textarea
    id: original
    attributes:
      label: Original wording
      description: Optional. If you first described the problem in another language, paste your own words here so nothing is lost in translation.
