name: AI Team OS CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  invariants:
    # 红线不变量：hook 双副本/版本锁步/双 dist 一致/venv 禁令（docs/knowledge-layer-design.md P0）
    # I9-I14（v1.11.1 起）需要 import 应用本体（fastmcp/sqlalchemy/pydantic），
    # 裸 checkout 会以 ModuleNotFoundError 假红——依赖清单与下方 test job 同源。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check invariants
        run: bash scripts/check_invariants.sh

  test:
    runs-on: ubuntu-latest
    env:
      # hatchling comes with .[dev] here; the sdist build tests must fail, not skip,
      # if it ever goes missing (they skip on machines without the dev extra).
      AITEAM_REQUIRE_HATCHLING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install langgraph langchain-anthropic langchain-core || true

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Codex installation and release migration regression
        # Uses isolated homes, databases and ports; native Codex execution is
        # an additional release-machine check, not simulated by this CI job.
        run: >-
          python -m pytest -q -rs
          tests/integration/test_codex_adapter_start.py
          tests/integration/test_codex_runtime.py
          tests/integration/test_codex_release_lifecycle.py
          tests/integration/test_codex_release_database.py
          tests/integration/test_mcp_concurrency.py

      - name: API, MCP HTTP and workflow integration regression
        # Isolated databases and homes; in-process ASGI or an OS-assigned local port.
        run: >-
          python -m pytest -q -rs
          tests/integration/api/test_task_id_prefix.py
          tests/integration/api/test_project_summary_leaders.py
          tests/integration/api/test_analytics_pagination.py
          tests/integration/api/test_dev_port_cors.py
          tests/integration/test_mcp_http_project_bootstrap.py
          tests/integration/test_workflow_null_tokens.py

  timezone-tests:
    # UTC runners skip the migration guards that distinguish local and UTC
    # clocks. Exercise their eastern and western branches without repeating
    # the full suite; each matrix entry still runs pytest serially.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone: [Asia/Shanghai, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run timezone-sensitive tests
        run: >-
          python -m pytest -v -rs --tb=short
          tests/unit/test_migrate_timestamps_utc.py
          tests/unit/test_utc_clock_marker.py
          tests/unit/storage/test_utc_convention.py
          tests/unit/storage/test_clock_convention.py
          tests/unit/services/test_ecosystem_local_time.py
          tests/unit/storage/test_alwaysload_local_dates.py

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript compile check
        working-directory: dashboard
        run: npx tsc -b --noEmit

      - name: Realtime event regression tests
        working-directory: dashboard
        run: npm test
